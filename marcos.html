<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Barbeiro - GANGSTAR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GANGSTAR</h1>
        <p>Conheça nossa equipe de especialistas</p>
    </header>

    <main>
        
        <div class="profile-container">
            
            <!-- Cabeçalho do Perfil (Foto e Especialidade) -->
            <div class="profile-header">
                <!-- Substitua pelo caminho da foto do barbeiro (ou use um ícone temporário) -->
                <img src="photos/marcos.jpg" alt="Foto do Barbeiro" class="profile-avatar">
                <div class="profile-title">
                    <h2>Marcos Mota</h2>
                    <p>Especialista em Cortes Clássicos</p>
                </div>
            </div>

            <!-- Biografia / Trajetória -->
            <div class="profile-bio">
                <h3>Sobre o Profissional</h3>
                <p>
                    Em aberto
                </p>
                
                <h3>Trabalhos Recentes</h3>
                <!-- Espaço para você colocar fotos dos cortes feitos por ele -->
                <div class="portfolio-grid">
                    <img src="photos/corte1_marcos.jpg" alt="Corte 1" class="portfolio-item">
                    <img src="photos/corte2_marcos.jpg" alt="Corte 2" class="portfolio-item">
                    <img src="photos/corte3_marcos.jpg" alt="Corte 3" class="portfolio-item">
                </div>
            </div>

            <!-- Botão Voltar -->
            <a href="index.html" class="btn-back">← Voltar para os Agendamentos</a>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 GANGSTAR - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
